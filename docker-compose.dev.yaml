services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unibo_toolkit
      POSTGRES_USER: unibo_user
      POSTGRES_PASSWORD: unibo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unibo_user -d unibo_toolkit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../databases/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgresql://unibo_user:unibo_pass@postgres:5432/unibo_toolkit?sslmode=disable"
      - "up"

  auth-service:
    image: ghcr.io/unibo-toolkit/auth-service:latest
    ports:
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.auth

  scraper-service:
    image: ghcr.io/unibo-toolkit/scraper-service:latest
    ports:
      - "8083:8083"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env.scraper

  calendar-manager:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
